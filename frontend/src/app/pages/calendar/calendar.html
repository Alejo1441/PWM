<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>booking date</title>
  <link rel="stylesheet" href="../css/calendar.css">
</head>
<body>

<div xlu-include-file="../partials/Header.html"></div>

<hr class="Color-Linea">

<div class="page">
  <div class="container">

    <div class="left">
      <h1 class="title" id="calendar-title">Servicio Ofrecido</h1>

      <div class="calendar">
        <div class="cal-header">
          <button class="nav-btn" id="prev-month" type="button">‹</button>

          <div class="selects">
            <select id="month-select"></select>
            <select id="year-select"></select>
          </div>

          <button class="nav-btn" id="next-month" type="button">›</button>
        </div>

        <div class="dow">
          <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
        </div>

        <div class="grid" id="calendar-grid"></div>
      </div>

      <p id="selected-date-text" class="selected-date-text">Fecha seleccionada:</p>

      <button class="btn-reserva" id="reserve-btn" type="button">Reservar fecha</button>
    </div>

    <div class="right">
      <div class="slots">
        <h2 class="slots-title">Horas disponibles</h2>
        <div class="slots-grid" id="slots-grid"></div>
      </div>
    </div>

  </div>
</div>


<div xlu-include-file="../partials/footer.html"></div>

<script src="../javascript/xlu-include-file.js"></script>
<script>xLuIncludeFile();</script>

<script src="../javascript/calendar.js"></script>
<script src="../javascript/auth.js"></script>

</body>
</html>
