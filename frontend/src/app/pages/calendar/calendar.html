<hr class="Color-Linea">

<div class="page">
    <div class="container">

        <div class="left">
            <h1 class="title">{{ title }}</h1>

            <div class="calendar">
                <div class="cal-header">
                    <button class="nav-btn" type="button" (click)="previousMonth()">‹</button>

                    <div class="selects">
                        <select [(ngModel)]="selectedMonth" (change)="changeMonth()">
                            <option *ngFor="let month of months; let i = index" [value]="i">
                                {{ month }}
                            </option>
                        </select>

                        <select [(ngModel)]="selectedYear" (change)="changeYear()">
                            <option *ngFor="let year of years" [value]="year">
                                {{ year }}
                            </option>
                        </select>
                    </div>

                    <button class="nav-btn" type="button" (click)="nextMonth()">›</button>
                </div>

                <div class="dow">
                    <div>Su</div>
                    <div>Mo</div>
                    <div>Tu</div>
                    <div>We</div>
                    <div>Th</div>
                    <div>Fr</div>
                    <div>Sa</div>
                </div>

                <div class="grid">
                    <button
                            *ngFor="let item of days"
                            type="button"
                            class="day"
                            [class.empty-day]="!item.day"
                            [class.today]="item.isToday"
                            [class.selected]="item.date === selectedDate"
                            [disabled]="!item.day"
                            (click)="selectDay(item.date)"
                    >
                        {{ item.day }}
                    </button>
                </div>
            </div>

            <p class="selected-date-text">
                Fecha seleccionada: {{ selectedDate }}
            </p>

            <button class="btn-reserva" type="button" (click)="reserveDate()">
                Reservar fecha
            </button>
        </div>

        <div class="right">
            <div class="slots">
                <h2 class="slots-title">Horas disponibles</h2>

                <div class="slots-grid">
                    <button
                            *ngFor="let slot of slots"
                            type="button"
                            class="slot"
                            [class.busy]="slot.busy"
                            [class.available]="!slot.busy"
                            [class.selected]="slot.time === selectedSlot"
                            [disabled]="slot.busy"
                            (click)="selectSlot(slot)"
                    >
                        {{ slot.time }}
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>
