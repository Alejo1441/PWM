<hr class="Color-Linea">

<main class="page">
    <div class="container">

        <div class="left">
            <h1>¿A qué vehículo le quieres realizar el servicio?</h1>

            <div class="car-list">
                <p *ngIf="cars.length === 0">
                    Sin coches, vaya al perfil para agregar uno.
                </p>

                <button
                        *ngFor="let car of cars"
                        type="button"
                        class="car-item"
                        [class.active]="selectedCar === car"
                        (click)="selectCar(car)"
                >
                    {{ car }}
                </button>
            </div>
        </div>

        <div class="right">
            <div class="summary">
                <p>
                    <strong>Vehículo seleccionado:</strong>
                    <span class="summary-value">{{ selectedCar }}</span>
                </p>

                <div>
                    <p *ngIf="tallerName">
                        <strong>Taller:</strong>
                        <span class="summary-value">{{ tallerName }}</span>
                    </p>

                    <p>
                        <strong>Tipo de servicio:</strong>
                        <span class="summary-value">{{ serviceName }}</span>
                    </p>
                </div>

                <p>
                    <strong>Fecha de la cita:</strong>
                    <span class="summary-value">{{ reservationText }}</span>
                </p>

                <div class="price-block">
                    <p><strong>Precio estimado:</strong></p>
                    <div class="price">{{ priceText }}</div>
                </div>
            </div>

            <button
                    class="confirm-btn"
                    type="button"
                    (click)="confirmReservation()"
            >
                Confirmar reserva
            </button>
        </div>

    </div>
</main>
