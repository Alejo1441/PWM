<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Car selection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/car_select.css">
</head>
<body>

<header id="site-header"></header>
<hr class="Color-Linea">

<main class="page">
  <div class="container">
    <div class="left">
      <h1>¿A qué vehículo le quieres realizar el servicio?</h1>
      <div class="car-list" id="car-list"></div>
    </div>

    <div class="right">
      <div class="summary">
        <p><strong>Vehículo seleccionado:</strong> <span id="selectedCar">Ninguno</span></p>
        <div id="info-servicio-taller">
          <p><strong>Tipo de servicio:</strong> nombre servicio</p>
        </div>
        <p><strong>Fecha de la cita:</strong> <span id="reservation-date">Día y fecha</span></p>
        <div class="price-block">
          <p><strong>Precio estimado:</strong></p>
          <div class="price">Precio</div>
        </div>
      </div>
      <button class="confirm-btn" id="confirm-reservation">Confirmar reserva</button>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="../javascript/xlu-include-file.js"></script>
<script>
  // Inyectamos los archivos ANTES de cargar la lógica de los botones
  xLuIncludeFile();
</script>
<script src="../javascript/auth.js"></script>
<script src="../javascript/car_select.js"></script>

</body>
</html>
