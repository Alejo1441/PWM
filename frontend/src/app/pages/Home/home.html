<section class="talleres-container d-flex flex-wrap gap-4 justify-content-center p-4">


    <div *ngFor="let taller of talleres"
         class="taller-card card shadow-sm"
         style="width: 18rem; cursor: pointer; transition: transform 0.2s;"
         (click)="irAlTaller(taller.id)">


        <img [src]="taller.fotoVisual"
             class="card-img-top"
             alt="{{ taller.name }}"
             style="height: 200px; object-fit: cover;">


        <div class="card-body text-center">
            <h5 class="card-title fw-bold text-dark">{{ taller.name }}</h5>

            <div class="mt-3">
                <span class="text-dark fs-5 estrellas">{{ taller.estrellasVisuales }}</span>
                <p class="text-muted m-0 small">{{ taller.numeroResenas }} Reseñas</p>
            </div>
        </div>

    </div>

</section>


<div class="text-center py-5" *ngIf="talleres.length === 0">
    <p>Cargando talleres...</p>
</div>
