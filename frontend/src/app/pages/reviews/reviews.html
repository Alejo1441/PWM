<hr class="Color-Linea">

<!-- Inyectamos la URL directamente en la variable CSS del main -->
<main class="reviews"
      *ngIf="tallerInfo"
      [style.--bg-taller]="'url(' + getImageUrl(tallerInfo.image ? tallerInfo.image[0] : '') + ')'">

    <h1 class="nombre-taller">Reviews del Taller '{{ tallerInfo.name }}'</h1>

    <div class="Resenas resena">

        <div *ngFor="let review of tallerInfo.reviews" class="item-resena">
            <img src="../../assets/fotoperfil.webp" alt="perfil" class="logo_circular">
            <div class="resenasyestrella">
                <p class="nombre-usuario fw-bold m-0">{{ review.username }}:</p>
                <span class="estrellas">{{ getEstrellasVisuales(review.stars) }}</span>
                <p class="texto-resenas m-0">{{ review.comment }}</p>
            </div>
        </div>

        <div *ngIf="!tallerInfo.reviews || tallerInfo.reviews.length === 0" class="text-center w-100 py-4">
            <p>Este taller aún no tiene reseñas.</p>
        </div>

    </div>
</main>

<div class="text-center py-5" *ngIf="!tallerInfo">
    <p>Cargando reseñas...</p>
</div>
