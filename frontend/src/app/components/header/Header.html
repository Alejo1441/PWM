<div class="d-flex justify-content-between align-items-center px-4 py-2" style="background-color: #D6D6D6; min-height: 90px;">

    <figure class="m-0">
        <a routerLink="/home" style="cursor: pointer;">
            <img id="Taller-image" src="../../assets/Nuestro%20logo.png" alt="logo" class="logo_circular rounded-circle border border-dark border-3">
        </a>
    </figure>

    <form id="search-form" class="d-none d-md-flex align-items-center gap-2 m-0">
        <input type="search" id="search-input" class="form-control rounded-pill border-dark border-3 search-input-custom" placeholder="Buscar Talleres..." required>
        <button type="submit" class="btn btn-light rounded-pill border border-dark border-2">🔍</button>
    </form>

    <figure class="m-0">
        <div class="d-flex align-items-center gap-3">

            <button
                    *ngIf="usuarioLogueado"
                    (click)="salir()"
                    id="btn-logout"
                    class="btn btn-danger">
                Salir
            </button>

            <a (click)="manejarClicPerfil()" id="profile-link" class="d-flex align-items-center gap-3 text-decoration-none text-dark fw-bold" style="cursor: pointer;">
                <img
                        id="profile-image"
                        [src]="fotoPerfilUrl || '../../assets/fotoperfil.webp'"
                        alt="perfil"
                        class="logo_circular rounded-circle border border-dark border-3"
                        style="width: 50px; height: 50px; object-fit: cover;">
            </a>

        </div>
    </figure>

</div>
