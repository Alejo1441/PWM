<div class="fondo-taller-dinamico" *ngIf="tallerInfo">
  <img [src]="getImageUrl(tallerInfo.image ? tallerInfo.image[0] : '')" alt="Fondo dinámico">
</div>

<main id="main-content" class="py-5">
    <h1 class="text-center mb-5 text-dark fw-bold">{{ tituloPagina }}</h1>

    <div class="d-flex flex-column align-items-center w-100">

        <article class="article-container" *ngFor="let item of itemsA_Mostrar">
            <details class="custom-details bg-white shadow-sm mb-3 w-75">
                <summary class="Titulo fw-bold p-3" style="cursor: pointer;">
                    {{ item.titulo }}
                </summary>
                <div class="content p-3 border-top">
                    <p class="texto m-0">{{ item.texto }}</p>
                </div>
            </details>
        </article>

        <div *ngIf="itemsA_Mostrar.length === 0 && !cargando" class="text-center mt-5">
            <p class="alert alert-warning">No se han encontrado datos para esta sección.</p>
        </div>

    </div>
</main>
