    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi Taller Web</title>

        <link rel="stylesheet" href="css/IndexStyle.css">

    </head>
    <body>
        <header id="site-header"></header>

        <hr class="Color-Linea">

        <main id="main-content"></main>

        <footer id="site-footer"></footer>

        <script src="javascript/main.js"></script>
        <script src="javascript/auth.js"></script>

        <dialog id="modal-auth-choice">
            <button class="close-btn" onclick="this.closest('dialog').close()">✖</button>
            <div class="modal-content">
                <button id="open-login" class="btn-white">INICIAR SESIÓN</button>
                <button id="open-register-choice" class="btn-black">REGISTRARSE</button>
            </div>
        </dialog>

        <dialog id="modal-login">
            <button class="close-btn" onclick="this.closest('dialog').close()">✖</button>
            <form id="form-login" method="dialog">
                <label>Email *</label>
                <input type="email" id="login-email" required placeholder="tu@email.com">
                <label>Contraseña *</label>
                <input type="password" id="login-pass" required minlength="4">
                <button type="submit" class="btn-black">ENTRAR</button>
            </form>
        </dialog>

        <dialog id="modal-reg-type">
            <button class="close-btn" onclick="this.closest('dialog').close()">✖</button>
            <div class="modal-content">
                <button id="go-reg-client" class="btn-white">Cliente</button>
                <button id="go-reg-company" class="btn-black">Empresa</button>
            </div>
        </dialog>

        <dialog id="modal-register-form">
            <button class="close-btn" onclick="this.closest('dialog').close()">✖</button>
            <form id="form-register">
                <label>Nombre *</label> <input type="text" required>
                <label>Apellido *</label> <input type="text" required>
                <label>Email *</label> <input type="email" required>
                <label>Municipio *</label> <input type="text" required>
                <label>Contraseña *</label> <input type="password" required id="reg-pass">
                <label>Confirmar Contraseña *</label> <input type="password" required id="reg-pass-conf">
                <button type="submit" class="btn-black">REGISTRARSE</button>
            </form>
        </dialog>



    </body>
    </html>
