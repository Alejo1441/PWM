<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="../css/quest.css">
</head>
<body>


<div class="overlay">
    <div class="form-container">

        <button class="close-btn">&times;</button>

        <h2 class="form-title">Registro</h2>

        <form class="custom-form">

            <div class="form-group">
                <label for="nombre">Nombre <span>*</span></label>
                <input type="text" id="nombre" placeholder="Value" required>
            </div>

            <div class="form-group">
                <label for="apellido">Apellido <span>*</span></label>
                <input type="text" id="apellido" placeholder="Value" required>
            </div>

            <div class="form-group">
                <label for="email">Email <span>*</span></label>
                <input type="email" id="email" placeholder="Value" required>
            </div>

            <div class="form-group">
                <label for="municipio">Municipio <span>*</span></label>
                <input type="text" id="municipio" placeholder="Value" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña <span>*</span></label>
                <input type="password" id="password" placeholder="Value" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmar Contraseña <span>*</span></label>
                <input type="password" id="confirm-password" placeholder="Value" required>
            </div>

            <a href="../Index.html" class="submit-btn">
                REGISTRARSE
            </a>

        </form>

    </div>
</div>

</body>
</html>
