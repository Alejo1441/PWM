<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Web</title>

    <link rel="stylesheet" href="../css/StyleTallerInformacion.css">

</head>
<body>
    <header id="site-header"></header>

    <hr class="Color-Linea">

    <div class="TallerInfo">

        <div class="cajabotones">
            <a href="../pages/calendar.html" class="botonEspecialidad">Especialidad1</a>
            <a href="../pages/calendar.html" class="botonEspecialidad">Especialidad2</a>
        </div>

        <hr class="Color-Linea">

        <main class="CajaInfo">
            <div class="CajaImagen">
                <img src="../Fotos/imagen.png" alt="Foto1" class="foto-taller">
                <img src="../Fotos/imagen.png" alt="Foto2" class="foto-taller">
            </div>

            <div class="CajaInfoTalleryResena">
                <p class="InfoTaller">Información del taller</p>

                <div class="Resenas">
                    <h3 class="texto-h3">Talleres cercanos a tu ubicación</h3>
                    <div class="resenasyestrella">
                        <span class="estrellas">★★★★★</span>
                        <a href="reviews.html" class="texto-resenas">Nº Reseñas</a>
                    </div>
                </div>

            </div>

            <div class="Cajamapa">
                <a href="https://www.google.com/maps/">

                    <img src="../Fotos/mapa.png" alt="Mapa Talleres" class="google-maps">

                </a>
            </div>
        </main>
    </div>

    <footer id="site-footer"></footer>

    <script src="../javascript/tallerespages.js"></script>
</body>
</html>
