<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Car selection</title>
    <link rel="stylesheet" href="../css/car_select.css">
</head>
<body>


<!-- HEADER -->
<div xlu-include-file="../partials/Header.html"></div>

<hr class="Color-Linea">

<div class="page">
    <div class="container">

        <!-- IZQUIERDA -->
        <div class="left">
            <h1>¿A que vehículo le quieres realizar el servicio?</h1>

            <div class="car-list" id="car-list"></div>
        </div>

        <!-- DERECHA -->
        <div class="right">
            <div class="summary">
                <p><strong>Vehículo seleccionado:</strong>
                    <span id="selectedCar">Ninguno</span>
                </p>

                <p><strong>Tipo de servicio:</strong> nombre servicio</p>

                <p><strong>Fecha de la cita:</strong>
                    <span id="reservation-date">Día y fecha</span>
                </p>

                <div class="price-block">
                    <p><strong>Precio estimado:</strong></p>
                    <div class="price">Precio</div>
                </div>
            </div>

            <button class="confirm-btn" id="confirm-reservation">
                Confirmar reserva
            </button>
        </div>

    </div>
</div>

<!-- FOOTER -->
<div xlu-include-file="../partials/footer.html"></div>

<!-- SCRIPTS (SOLO UNA VEZ) -->
<script src="../javascript/xlu-include-file.js"></script>
<script>xLuIncludeFile();</script>

<script src="../javascript/car_select.js"></script>
<script src="../javascript/auth.js"></script>

</body>
</html>
